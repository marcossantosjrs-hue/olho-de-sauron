[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olho-de-sauron"
version = "1.0.0"
description = "Scanner DevSecOps CLI automatizado (SAST AST, Segredos, Hardening e Dependências) com saída Terminal, JSON, Markdown, SARIF e HTML."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Marcos Antonio" }
]
keywords = ["devsecops", "appsec", "sast", "cybersecurity", "sarif", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "colorama>=0.4.6",
    "fastapi>=0.115",
    "PyYAML>=6.0",
    "rich>=13.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
full = [
    "psutil>=5.9",
]
build = [
    "pillow>=10.0",
    "pyinstaller>=6.0",
]

[project.scripts]
sauron = "olho_de_sauron.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["olho_de_sauron*"]

[tool.setuptools.package-data]
"olho_de_sauron.web" = ["static/*.html", "static/*.png", "static/*.ico"]
